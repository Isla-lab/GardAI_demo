<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Monitoring of Lake Garda</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png'), linear-gradient(to bottom, #b3ecff 0%, #e6f7ff 100%);
            background-repeat: repeat;
            background-size: cover;
            color: #023047;
        }

        h1 {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(0, 105, 148, 0.95);
            color: white;
            margin-bottom: 3rem;
            font-size: 2.8rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
        }

        .plot-container {
            width: 94%;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2.5rem 2rem 3.5rem 2rem;
            background-color: rgba(255, 255, 255, 0.88);
            border-radius: 24px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            backdrop-filter: blur(14px);
            position: relative;
            z-index: 1;
        }

        .plot-container::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            background: rgba(255, 255, 255, 0.28);
            z-index: -1;
            border-radius: 28px;
        }

        #ph-plot, #temp-plot, #oxygen-plot, #sonar-plot, #tds-plot {
            height: 420px;
        }
    </style>
</head>
<body>
    <h1>Environmental Monitoring of Lake Garda</h1>

    <div class="plot-container"><div id="ph-plot"></div></div>
    <div class="plot-container"><div id="temp-plot"></div></div>
    <div class="plot-container"><div id="oxygen-plot"></div></div>
    <div class="plot-container"><div id="sonar-plot"></div></div>
    <div class="plot-container"><div id="tds-plot"></div></div>

    <script>
        const commonLayout = {
            xaxis: { title: { text: 'Time', font: { size: 18 } }, tickfont: { size: 14 } },
            yaxis: { tickfont: { size: 14 } },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#023047', family: 'Quicksand' },
            title: { font: { family: 'Roboto', size: 28, color: '#0077b6' } }
        };

        Plotly.newPlot('ph-plot', [{ x: [], y: [], mode: 'lines', name: 'H2O_ph' }], {
            ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'pH' }, title: 'H2O pH Level'
        });

        Plotly.newPlot('temp-plot', [{ x: [], y: [], mode: 'lines', name: 'H2O_tds_temp' }], {
            ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Temperature (°C)' }, title: 'Temperature (°C)'
        });

        Plotly.newPlot('oxygen-plot', [{ x: [], y: [], mode: 'lines', name: 'H2O_oxygen' }], {
            ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Oxygen Level (mg/L)' }, title: 'H2O Oxygen Level'
        });

        Plotly.newPlot('sonar-plot', [{ x: [], y: [], mode: 'lines', name: 'Sonar_val' }], {
            ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Sonar Distance (m)' }, title: 'Sonar Value'
        });

        Plotly.newPlot('tds-plot', [{ x: [], y: [], mode: 'lines', name: 'H2O_tds_val' }], {
            ...commonLayout, yaxis: { ...commonLayout.yaxis, title: 'Conductivity (uS)' }, title: 'Conductivity (uS)'
        });

        function updateData() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    const time = new Date().toLocaleTimeString();

                    Plotly.extendTraces('ph-plot', { x: [[time]], y: [[data.H2O_ph]] }, [0]);
                    Plotly.extendTraces('temp-plot', { x: [[time]], y: [[data.H2O_tds_temp]] }, [0]);
                    Plotly.extendTraces('oxygen-plot', { x: [[time]], y: [[data.H2O_oxygen]] }, [0]);
                    Plotly.extendTraces('sonar-plot', { x: [[time]], y: [[data.Sonar_val]] }, [0]);
                    Plotly.extendTraces('tds-plot', { x: [[time]], y: [[data.H2O_tds_val]] }, [0]);
                });
        }

        setInterval(updateData, 1000);
    </script>
</body>
</html>
